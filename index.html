<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RRB ALP Handling Report - South East Central Railway</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    body{
      background:linear-gradient(135deg,#b1d5e6 0%,#87ceeb 100%);
      font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      padding:16px; min-height:100vh;
      overflow-x:hidden;
    }
    .container{
      max-width:1032px; margin:0 auto;
      background:rgb(138,201,241);
      border-radius:15px;
      box-shadow:0 10px 40px rgba(0,0,0,0.2);
      overflow:hidden;
    }
    .header{
      background:linear-gradient(135deg,#1a237e 0%,#283593 100%);
      color:#fff; border-bottom:4px solid #FFD700;
      padding:12px 18px;
      position:relative;
    }
    .header-inner{display:flex;align-items:center;gap:14px;}
    .logo-circle{
      width:64px;height:64px;border-radius:50%;
      border:3px solid #FFD700;background:rgba(255,255,255,0.1);
      display:flex;align-items:center;justify-content:center;
      font-size:9px;color:#FFD700;text-align:center;padding:6px;font-weight:bold;
      flex-shrink:0;
    }
    .header-text{text-align:center;flex:1;}
    .header-text .hindi{font-size:1.4em;font-weight:bold;letter-spacing:1px;text-shadow:1px 1px 3px rgba(0,0,0,.3);}
    .header-text .sub{font-size:0.82em;color:#FFD700;font-weight:bold;letter-spacing:1px;margin-top:3px;text-transform:uppercase;}
    .header-text .sub2{font-size:0.75em;color:#FFD700;opacity:.85;letter-spacing:.5px;}
    .header-meta{font-size:11px;color:#FFD700;line-height:1.8;text-align:right;flex-shrink:0;}
    .form-container{padding:18px;background:#e4e7e7;}
    .section{
      background:rgb(212,220,218);padding:15px;margin-bottom:16px;
      border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.1);
    }
    .section-title{
      font-size:0.95em;font-weight:bold;
      background:linear-gradient(135deg,#1a237e,#3949ab);
      color:#fff;padding:7px 12px;border-radius:5px;
      letter-spacing:1px;margin-bottom:14px;text-transform:uppercase;text-align:center;
    }
    .fields-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;}
    .fields-grid.cols-3{grid-template-columns:repeat(3,1fr);}
    .field-pair{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:0 10px;}
    .field-pair label{font-size:12px;font-weight:bold;color:#1a237e;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
    input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{
      width:100%;padding:7px 9px;border:2px solid #b3d9ff;border-radius:5px;
      font-size:12px;font-weight:bold;background:#fff;
      transition:border-color .3s,box-shadow .3s;color:#1a237e;height:34px;
    }
    textarea{height:auto;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#4a90e2;box-shadow:0 0 8px rgba(74,144,226,.3);}
    input[type="text"],textarea{text-transform:uppercase;}
    #entriesWrap{display:flex;flex-direction:column;gap:14px;}
    .entry-card{background:#fff;border:2px solid #b3d9ff;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.08);overflow:hidden;}
    .entry-card-head{
      background:linear-gradient(135deg,#1a237e 0%,#4a8ec2 100%);color:#fff;
      padding:7px 12px;display:flex;align-items:center;justify-content:space-between;
    }
    .entry-card-head .entry-num{font-size:12px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;}
    .entry-card-body{padding:14px;background:#f0f8ff;}
    .entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px;}
    .entry-field{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:0 10px;}
    .entry-field label{font-size:11px;font-weight:bold;color:#1a237e;text-transform:uppercase;letter-spacing:.3px;}
    .entry-field.full{grid-column:1/-1;grid-template-columns:140px 1fr;align-items:start;}
    .entry-field.full label{padding-top:7px;}
    .entry-field textarea{resize:vertical;min-height:42px;height:auto;}
    .btn-row{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap;}
    .btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;transition:all .3s;text-transform:uppercase;letter-spacing:.5px;}
    .btn-green{background:linear-gradient(135deg,#27ae60,#229954);color:#fff;}
    .btn-green:hover{background:linear-gradient(135deg,#229954,#1e8449);transform:translateY(-1px);}
    .btn-green:disabled{background:#aaa;cursor:not-allowed;transform:none;}
    .btn-blue{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;}
    .btn-blue:hover{background:linear-gradient(135deg,#283593,#1a237e);transform:translateY(-1px);}
    .btn-blue:disabled{background:#aaa;cursor:not-allowed;transform:none;}
    .btn-red{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;}
    .btn-red:hover{background:linear-gradient(135deg,#a93226,#c0392b);transform:translateY(-1px);}
    .btn-grey{background:linear-gradient(135deg,#566573,#7f8c8d);color:#fff;}
    .btn-grey:hover{background:linear-gradient(135deg,#424949,#566573);transform:translateY(-1px);}
    /* ── Saving overlay ── */
    #saveOverlay{display:none;position:fixed;inset:0;background:rgba(30,34,60,.72);z-index:10000;align-items:center;justify-content:center;padding:15px;}
    #saveOverlay.show{display:flex;}
    .save-card{background:#fff;border-radius:22px;padding:30px 40px 28px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:100%;width:320px;}
    .up-stage{position:relative;width:110px;height:110px;margin:0 auto 14px;}
    .up-cloud{font-size:64px;line-height:110px;animation:cloudBob 1.4s ease-in-out infinite;}
    .up-arrow{position:absolute;left:50%;bottom:8px;font-size:26px;font-weight:bold;color:#27ae60;opacity:0;margin-left:-10px;animation:arrowUp 1.5s ease-in infinite;}
    .up-arrow.a2{animation-delay:.5s;margin-left:-26px;}
    .up-arrow.a3{animation-delay:1s;margin-left:6px;}
    @keyframes arrowUp{0%{transform:translateY(0);opacity:0;}20%{opacity:1;}100%{transform:translateY(-70px);opacity:0;}}
    @keyframes cloudBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
    .ok-stage{display:none;width:110px;height:110px;margin:0 auto 14px;align-items:center;justify-content:center;}
    .ok-circle{stroke:#27ae60;stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;animation:drawC .5s ease forwards;}
    .ok-tick{stroke:#27ae60;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:drawC .35s .4s ease forwards;}
    @keyframes drawC{to{stroke-dashoffset:0;}}
    .save-title{font-size:18px;font-weight:bold;color:#1e8449;letter-spacing:.4px;text-transform:uppercase;}
    .save-sub{margin-top:8px;font-size:13px;font-weight:bold;color:#27ae60;}
    .up-bar{margin-top:16px;height:6px;background:#d5efdc;border-radius:4px;overflow:hidden;}
    .up-bar i{display:block;height:100%;width:40%;background:#27ae60;border-radius:4px;animation:barMove 1.1s ease-in-out infinite;}
    @keyframes barMove{0%{margin-left:-40%;}100%{margin-left:100%;}}
    #saveOverlay.done .up-stage,#saveOverlay.done .up-bar{display:none;}
    #saveOverlay.done .ok-stage{display:flex;}
    /* ── Bottom nav ── */
    body{padding-bottom:84px;}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:9000;display:flex;gap:6px;justify-content:center;align-items:stretch;
      padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:#fff;
      border-top:3px solid #FFD700;box-shadow:0 -4px 16px rgba(0,0,0,.3);}
    .nav-btn{flex:1;max-width:170px;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      padding:4px 4px;border:none;border-radius:8px;cursor:pointer;color:#fff;text-decoration:none;font-family:inherit;
      font-weight:bold;transition:transform .12s,filter .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
    .nav-btn.wide{flex:1.5;max-width:220px;}
    .nav-btn:active{transform:scale(.94);}
    .nav-btn .ni{font-size:16px;line-height:1;}
    .nav-btn .nl{font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;white-space:normal;text-align:center;line-height:1.15;}
    .nb-blue{background:linear-gradient(135deg,#3949ab,#5c6bc0);}
    .nb-green{background:linear-gradient(135deg,#27ae60,#229954);}
    .nb-red{background:linear-gradient(135deg,#c0392b,#e74c3c);}
    .nb-grey{background:linear-gradient(135deg,#566573,#7f8c8d);}
    .nb-dark{background:linear-gradient(180deg,#2b2b2b,#000);color:#FFD700;border:1px solid #00bcd4;}
    .nav-btn:disabled{filter:grayscale(.6);opacity:.75;cursor:not-allowed;}
    .nav-btn.submitted{background:linear-gradient(135deg,#7f8c8d,#95a5a6);}
    .nav-btn.loading .ni{display:inline-block;width:14px;height:14px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;font-size:0;animation:saveSpin .8s linear infinite;}
    @keyframes saveSpin{to{transform:rotate(360deg);}}
    .delete-btn{background:#e74c3c;color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.3px;}
    .delete-btn:hover{background:#c0392b;}
    #toast{
      display:none;position:fixed;bottom:90px;left:50%;max-width:92vw;text-align:center;transform:translateX(-50%);
      padding:12px 28px;border-radius:8px;font-size:14px;font-weight:bold;
      color:#fff;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.3);
      animation:fadeIn .3s ease;
    }
    #toast.success{background:#27ae60;}
    #toast.error{background:#e74c3c;}
    #toast.info{background:#1a237e;}
    @keyframes fadeIn{from{opacity:0;bottom:70px;}to{opacity:1;bottom:90px;}}

    /* ── Tablet ── */
    @media (max-width:900px){
      .entry-grid{grid-template-columns:repeat(2,1fr);}
      .entry-field,.entry-field.full,.field-pair{grid-template-columns:120px 1fr;}
    }

    /* ── Mobile ── */
    @media (max-width:700px){
      body{padding:6px 6px 88px;}
      .container{border-radius:10px;}
      .header{padding:10px 10px;}
      .header-inner{gap:8px;}
      .header-text .hindi{font-size:1.05em;letter-spacing:.3px;line-height:1.25;}
      .header-text .sub{font-size:.72em;}
      .header-text .sub2{font-size:.68em;}
      .form-container{padding:10px;}
      .section{padding:10px;margin-bottom:12px;}
      .section-title{font-size:.85em;padding:6px 8px;margin-bottom:10px;}
      .fields-grid,.fields-grid.cols-3{grid-template-columns:1fr;gap:10px;}
      .field-pair,.entry-field,.entry-field.full{grid-template-columns:1fr;gap:4px 0;}
      .field-pair[style*="grid-column"]{grid-column:auto !important;}
      .field-pair label,.entry-field label{white-space:normal;font-size:11px;}
      .entry-field.full label{padding-top:0;}
      .entry-field:has(input[style*="hidden"]){display:none;}
      .entry-grid{grid-template-columns:1fr;gap:10px;}
      .entry-card-head{padding:8px 10px;}
      .entry-card-body{padding:10px;}
      .delete-btn{padding:7px 12px;font-size:11px;}
      input[type="text"],input[type="date"],input[type="time"],input[type="number"],select,textarea{font-size:16px;height:42px;}
      input[type="date"]{min-width:0;-webkit-appearance:none;appearance:none;}
      textarea{height:auto;min-height:56px;}
      #traineeName{min-width:0;}
      .field-pair > div[style*="display:flex"]{flex-wrap:nowrap;}
      .field-pair .btn-blue{height:42px !important;padding:5px 8px !important;}
      #fixBanner{font-size:11px !important;padding:10px 12px !important;}
      .nav-btn .nl{font-size:8.5px;}
      .nav-btn .ni{font-size:15px;}
      .nav-btn{padding:3px 2px;min-height:46px;}
      .nav-btn.wide{flex:1.7;}
      .bottom-nav{gap:4px;padding-left:4px;padding-right:4px;}
      #toast{font-size:13px;padding:10px 16px;width:92vw;}
      .save-card{padding:24px 20px;}
    }
    @media (max-width:360px){
      .nav-btn .nl{font-size:7.5px;letter-spacing:0;}
      .nav-btn .ni{font-size:14px;}
      .header-text .hindi{font-size:.95em;}
    }
    @media (max-width:700px) and (orientation:landscape){
      body{padding-bottom:70px;}
      .nav-btn{min-height:38px;}
      .nav-btn .nl{display:none;}
      .nav-btn .ni{font-size:18px;}
    }
    input[type="text"][readonly]{
      background: linear-gradient(135deg,#e8f5e9,#f1f8e9);
      color:#1a237e;
      cursor:not-allowed;
      border-color:#66bb6a;
      font-style:italic;
    }
    input[type="text"][readonly]::after{content:" ✓";}
    .auto-filled-label::after{content:" ✓";color:#27ae60;font-size:10px;}
  </style>
</head>

<script>
  // ── Google Apps Script Web App URL ──
  // This single Apps Script handles BOTH trainee fetch AND form submission.
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzBiQy6NPp81IlbtlpCebIgKhdoGoy34BEja-kYssyOM400py4VuMRC8no4vH3lUsXFlA/exec';

  // ── Trainee Sheet details ──
  const TRAINEE_SHEET_ID = '1Yn450uce02hgfbXJmRzd9aBY6bBEgaginXOctu--izg';
  const SHEET_CSV_DIRECT = `https://docs.google.com/spreadsheets/d/${TRAINEE_SHEET_ID}/export?format=csv&gid=0`;

  // CORS proxy list — tried in order until one works
  const CORS_PROXIES = [
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://cors-anywhere.herokuapp.com/${url}`,
  ];

  // ── Trainee Data Store ──
  let traineeData = {};

  // ── Parse CSV (handles quoted fields with commas inside) ──
  function parseCSV(text) {
    const rows = [];
    const lines = text.split(/\r?\n/);
    for (const line of lines) {
      if (!line.trim()) continue;
      const row = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      row.push(cur.trim());
      rows.push(row);
    }
    return rows;
  }

  // ── Build dropdown from parsed CSV rows ──
  function populateFromCSV(csvText, sel) {
    const rows = parseCSV(csvText);
    if (rows.length < 2) throw new Error('Sheet has no data rows');

    const headers = rows[0].map(h => String(h).trim().toUpperCase());
    const nameIdx  = headers.findIndex(h => h.includes('NAME'));
    const desigIdx = headers.findIndex(h => h.includes('DESIG'));
    const hqIdx    = headers.findIndex(h => h === 'HQ' || h.includes('H.Q') || h.includes('HEAD'));
    const hrmsIdx  = headers.findIndex(h => h.includes('HRMS'));

    if (nameIdx < 0) throw new Error('NAME column not found in sheet. Check headers.');

    traineeData = {};
    sel.innerHTML = '<option value="">-- Select Trainee Name --</option>';

    // Collect all trainees first, then sort A-Z
    const traineesTemp = [];
    for (let i = 1; i < rows.length; i++) {
      const row  = rows[i];
      const name = String(row[nameIdx] || '').trim().toUpperCase();
      if (!name) continue;
      traineesTemp.push({
        name,
        designation: desigIdx >= 0 ? String(row[desigIdx] || '').trim() : '',
        hq:          hqIdx    >= 0 ? String(row[hqIdx]    || '').trim() : '',
        hrms:        hrmsIdx  >= 0 ? String(row[hrmsIdx]  || '').trim() : '',
      });
    }

    // Sort A-Z by name
    traineesTemp.sort((a, b) => a.name.localeCompare(b.name));

    traineesTemp.forEach(t => {
      traineeData[t.name] = { designation: t.designation, hq: t.hq, hrms: t.hrms };
      const opt = document.createElement('option');
      opt.value = t.name; opt.textContent = t.name;
      sel.appendChild(opt);
    });

    return traineesTemp.length;
  }

  // ── Build dropdown from Apps Script JSON response ──
  function populateFromJSON(trainees, sel) {
    traineeData = {};
    sel.innerHTML = '<option value="">-- Select Trainee Name --</option>';

    // Sort A-Z by name before populating
    const sorted = [...trainees].sort((a, b) =>
      String(a.name || '').trim().toUpperCase().localeCompare(String(b.name || '').trim().toUpperCase())
    );

    sorted.forEach(t => {
      const name = String(t.name || '').trim().toUpperCase();
      if (!name) return;
      traineeData[name] = {
        designation: String(t.designation || '').trim(),
        hq:          String(t.hq          || '').trim(),
        hrms:        String(t.hrms         || '').trim(),
      };
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    return sorted.length;
  }

  async function loadTrainees() {
    const sel = document.getElementById('traineeName');
    sel.innerHTML = '<option value="">⏳ Fetching trainees...</option>';
    sel.disabled = true;

    const strategies = [
      // 1️⃣ Apps Script endpoint (most reliable — already has CORS headers)
      async () => {
        const res = await fetch(SHEET_URL + '?action=getTrainees', { signal: AbortSignal.timeout(8000) });
        const data = await res.json();
        if (data.status !== 'success' || !data.trainees?.length) throw new Error(data.message || 'No trainees returned');
        return { count: populateFromJSON(data.trainees, sel), label: 'Apps Script' };
      },
      // 2️⃣ Direct CSV (works if sheet is public)
      async () => {
        const res = await fetch(SHEET_CSV_DIRECT, { signal: AbortSignal.timeout(8000) });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const csv = await res.text();
        return { count: populateFromCSV(csv, sel), label: 'Google Sheets (direct)' };
      },
      // 3️⃣ CORS proxy — allorigins.win
      async () => {
        const url = CORS_PROXIES[0](SHEET_CSV_DIRECT);
        const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
        const csv = await res.text();
        return { count: populateFromCSV(csv, sel), label: 'allorigins proxy' };
      },
      // 4️⃣ CORS proxy — corsproxy.io
      async () => {
        const url = CORS_PROXIES[1](SHEET_CSV_DIRECT);
        const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
        if (!res.ok) throw new Error('Proxy2 HTTP ' + res.status);
        const csv = await res.text();
        return { count: populateFromCSV(csv, sel), label: 'corsproxy.io' };
      },
    ];

    for (let i = 0; i < strategies.length; i++) {
      try {
        const { count, label } = await strategies[i]();
        sel.disabled = false;
        showToast(`✅ ${count} trainees loaded via ${label}!`, 'success');
        const b = document.getElementById('fixBanner');
        if (b) b.remove();
        return; // success — stop trying
      } catch (err) {
        console.warn(`Strategy ${i + 1} failed:`, err.message);
      }
    }

    // All strategies failed
    sel.innerHTML = '<option value="">⚠️ Could not load trainees</option>';
    sel.disabled = false;
    showToast('❌ All fetch methods failed. See fix instructions below.', 'error');
    showFixBanner();
  }

  function showFixBanner() {
    if (document.getElementById('fixBanner')) return;
    const banner = document.createElement('div');
    banner.id = 'fixBanner';
    banner.style.cssText = 'background:#fff3cd;border:2px solid #ffc107;border-radius:8px;padding:14px 18px;margin:12px 0;font-size:12px;color:#856404;line-height:1.8;';
    banner.innerHTML = `
      <strong>⚠️ Could not fetch trainee data. Fix one of the following:</strong><br>
      <b>Option A (Recommended):</b> In your Google Apps Script, redeploy with <i>Execute as: Me</i> and <i>Who has access: Anyone</i>.<br>
      <b>Option B:</b> Open the Google Sheet → Share → <i>Anyone with the link → Viewer</i> → Save.<br>
      <b>Then click 🔄 Refresh above.</b>
    `;
    document.querySelector('.form-container').prepend(banner);
  }

  function autoFillTrainee(name) {
    const data  = traineeData[name] || {};
    const desig = document.getElementById('designation');
    const hq    = document.getElementById('hq');
    const hrms  = document.getElementById('hrms');

    desig.value = data.designation || '';
    hq.value    = data.hq          || '';
    hrms.value  = data.hrms        || '';

    [desig, hq, hrms].forEach(el => {
      if (el.value) {
        el.setAttribute('readonly', true);
        el.title = 'Auto-filled from Google Sheet';
      } else {
        el.removeAttribute('readonly');
        el.title = '';
      }
    });

    // Visual feedback
    if (name) {
      showToast('✅ Auto-filled: ' + name, 'success');
    }
  }

  document.addEventListener('DOMContentLoaded', loadTrainees);

  let rowCount = 0;

  function addRow(scroll) {
    rowCount++;
    const wrap = document.getElementById('entriesWrap');
    const card = document.createElement('div');
    card.className = 'entry-card';
    card.setAttribute('data-entry', rowCount);
    card.innerHTML = `
      <div class="entry-card-head">
        <span class="entry-num">Entry ${rowCount}</span>
        <button class="delete-btn" onclick="this.closest('.entry-card').remove()">✕ Remove</button>
      </div>
      <div class="entry-card-body">
        <div class="entry-grid">
          <div class="entry-field"><label>Date</label><input type="date" name="date"></div>
          <div class="entry-field"><label>Train No.</label><input type="text" name="trainNo" inputmode="numeric"></div>
          <div class="entry-field"><label>Loco No.</label><input type="text" name="locoNo" inputmode="numeric"></div>
          <div class="entry-field"><label>From Station</label><input type="text" name="fromStation" list="stationList" autocomplete="off"></div>
          <div class="entry-field"><label>Dep. Time</label><input type="text" name="depTime"></div>
          <div class="entry-field"><label>To Station</label><input type="text" name="toStation" list="stationList" autocomplete="off"></div>
          <div class="entry-field"><label>Arr. Time</label><input type="text" name="arrTime"></div>
          <div class="entry-field"><label>Footplate KM</label><input type="text" name="footplateKm" inputmode="decimal"></div>
          <div class="entry-field"><label>&nbsp;</label><input type="text" style="visibility:hidden"></div>
          <div class="entry-field full"><label>Working LP Name/HQ/CMS ID</label><textarea rows="2" name="lpAlpName"></textarea></div>
          <div class="entry-field full"><label>Remarks if any</label><textarea rows="2" name="itemsDiscussed"></textarea></div>
          <div class="entry-field full" style="display:none;"><label style="display:none;">Name of CC/SM</label><textarea rows="2" name="ccSmName"></textarea></div>
        </div>
      </div>
    `;
    wrap.appendChild(card);
    if (scroll) card.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = type;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  function collectData() {
    const timestamp = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
    const header = {
      timestamp,
      traineeName:  document.getElementById('traineeName').value,
      designation:  document.getElementById('designation').value,
      hq:           document.getElementById('hq').value,
      hrms:         document.getElementById('hrms').value,
      nominatedcli: document.getElementById('nominatedcli').value,
    };
    const entries = [];
    document.querySelectorAll('.entry-card').forEach((card, i) => {
      const get = name => { const el = card.querySelector(`[name="${name}"]`); return el ? el.value : ''; };
      entries.push({
        entryNo:        i + 1,
        date:           get('date'),
        trainNo:        get('trainNo'),
        locoNo:         get('locoNo'),
        fromStation:    get('fromStation'),
        depTime:        get('depTime'),
        toStation:      get('toStation'),
        arrTime:        get('arrTime'),
        footplateKm:    get('footplateKm'),
        lpAlpName:      get('lpAlpName'),
        itemsDiscussed: get('itemsDiscussed'),
        ccSmName:       get('ccSmName'),
      });
    });
    return { header, entries };
  }

  let isSubmitted = false;

  // ── Saving overlay (blocks the page until data is saved) ──
  function warnBeforeLeave(e) { e.preventDefault(); e.returnValue = ''; }
  function showSaving(on) {
    const ov = document.getElementById('saveOverlay');
    ov.classList.remove('done');
    document.getElementById('saveTitle').textContent = 'Uploading data...';
    document.getElementById('saveSub').textContent = 'Please wait — do not close or refresh';
    ov.classList.toggle('show', on);
    if (on) window.addEventListener('beforeunload', warnBeforeLeave);
    else    window.removeEventListener('beforeunload', warnBeforeLeave);
  }
  function showSaved() {
    const ov = document.getElementById('saveOverlay');
    ov.classList.add('done');
    document.getElementById('saveTitle').textContent = '✅ Data Saved';
    document.getElementById('saveSub').textContent = 'Submitted successfully';
    window.removeEventListener('beforeunload', warnBeforeLeave);
  }
  function setSubmitBtn(state) {
    const b = document.getElementById('submitBtn');
    const ic = document.getElementById('submitIcon');
    const lb = document.getElementById('submitLabel');
    b.classList.remove('loading','submitted');
    if (state === 'loading')   { b.disabled = true;  b.classList.add('loading'); ic.textContent = '⏳'; lb.textContent = 'Uploading'; }
    else if (state === 'done') { b.disabled = false; b.classList.add('submitted'); ic.textContent = '✅'; lb.textContent = 'Submitted'; b.title = 'Data already submitted'; }
    else                       { b.disabled = false; ic.textContent = '✔'; lb.textContent = 'Submit to Google Sheet'; b.title = ''; }
  }

  // ── Reset the whole form back to blank ──
  function resetForm() {
    if (!confirm('⚠️ RESET FORM?\n\nALL ENTERED DATA WILL BE CLEARED.')) return;

    // Trainee details
    const trainee = document.getElementById('traineeName');
    trainee.value = '';
    ['designation', 'hq', 'hrms'].forEach(id => {
      const el = document.getElementById(id);
      el.value = '';
      el.removeAttribute('readonly');
      el.title = '';
    });
    document.getElementById('nominatedcli').value = '';

    // Handling entries: remove all, start again with one blank entry
    document.getElementById('entriesWrap').innerHTML = '';
    rowCount = 0;
    addRow();

    // Re-enable Submit / PDF buttons
    isSubmitted = false;
    setSubmitBtn('idle');
    document.getElementById('pdfBtn').disabled = false;
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('🔄 Form reset. All fields are blank.', 'info');
  }

  async function handleSubmit() {
    if (isSubmitted) {
      alert('⚠️ DATA ALREADY SUBMITTED');
      return;
    }

    const cliVal = document.getElementById('nominatedcli').value;
    if (!cliVal) {
      showToast('❌ NOMINATED CLI IS MANDATORY. PLEASE SELECT A CLI.', 'error');
      document.getElementById('nominatedcli').focus();
      return;
    }

    setSubmitBtn('loading');
    const payload = collectData();
    showSaving(true);
    const startedAt = Date.now();

    try {
      await fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      // no-cors → opaque response; reaching here means the request went through
      const wait = 1500 - (Date.now() - startedAt);   // keep upload animation visible
      if (wait > 0) await new Promise(r => setTimeout(r, wait));
      isSubmitted = true;
      setSubmitBtn('done');
      showSaved();
      showToast('✅ Data saved successfully!', 'success');
      await new Promise(r => setTimeout(r, 1600));
      showSaving(false);
    } catch (err) {
      showSaving(false);
      showToast('❌ Failed to connect. Check the Web App URL.', 'error');
      setSubmitBtn('idle');
    }
  }

  function generatePDF() {
    const btn = document.getElementById('pdfBtn');
    btn.disabled = true;
    btn.querySelector('.nl').textContent = 'Wait...';

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      const pageW = doc.internal.pageSize.getWidth();
      const margin = 10;

      // ── Header ──
      doc.setFillColor(26, 35, 126);
      doc.rect(0, 0, pageW, 22, 'F');
      doc.setFontSize(14);
      doc.setTextColor(255, 215, 0);
      doc.setFont('helvetica', 'bold');
      doc.text('SOUTH EAST CENTRAL RAILWAY — RAIPUR DIVISION', pageW / 2, 8, { align: 'center' });
      doc.setFontSize(10);
      doc.text('RRB ALP HANDLING REPORT', pageW / 2, 15, { align: 'center' });

      // Timestamp
      const ts = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
      doc.setFontSize(7);
      doc.setTextColor(255, 215, 0);
      doc.text('Generated: ' + ts, pageW - margin, 20, { align: 'right' });

      let y = 28;

      // ── Trainee Details ──
      const td = collectData().header;
      doc.setFillColor(57, 73, 171);
      doc.rect(margin, y, pageW - margin * 2, 7, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.text('TRAINEE DETAILS', pageW / 2, y + 5, { align: 'center' });
      y += 10;

      doc.setTextColor(26, 35, 126);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      const cols = [
        ['Name of Trainee', td.traineeName],
        ['Designation', td.designation],
        ['HQ', td.hq],
        ['HRMS ID', td.hrms],
        ['Nominated CLI', td.nominatedcli],
      ];
      const colW = (pageW - margin * 2) / 3;
      cols.forEach(([label, val], idx) => {
        const cx = margin + (idx % 3) * colW;
        const cy = y + Math.floor(idx / 3) * 10;
        doc.setFont('helvetica', 'bold');
        doc.text(label + ':', cx, cy);
        doc.setFont('helvetica', 'normal');
        doc.text((val || '').toUpperCase(), cx + 38, cy);
      });
      y += Math.ceil(cols.length / 3) * 10 + 4;

      // ── Entries Table ──
      doc.setFillColor(57, 73, 171);
      doc.rect(margin, y, pageW - margin * 2, 7, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'bold');
      doc.text('HANDLING DETAILS', pageW / 2, y + 5, { align: 'center' });
      y += 9;

      const { entries } = collectData();
      const tableHead = [['#', 'Date', 'Train No', 'Loco No', 'From', 'Dep', 'To', 'Arr', 'KM', 'LP/ALP Name & Sign.', 'Items Discussed', 'CC/SM Name']];
      const tableBody = entries.map(e => [
        e.entryNo, e.date, e.trainNo, e.locoNo, e.fromStation, e.depTime,
        e.toStation, e.arrTime, e.footplateKm, e.lpAlpName, e.itemsDiscussed, e.ccSmName
      ]);

      doc.autoTable({
        startY: y,
        head: tableHead,
        body: tableBody,
        margin: { left: margin, right: margin },
        styles: { fontSize: 7, cellPadding: 2, overflow: 'linebreak', textColor: [26, 35, 126] },
        headStyles: { fillColor: [26, 35, 126], textColor: [255, 215, 0], fontStyle: 'bold', halign: 'center' },
        alternateRowStyles: { fillColor: [240, 248, 255] },
        columnStyles: {
          0:  { cellWidth: 6,  halign: 'center' },
          1:  { cellWidth: 18 },
          2:  { cellWidth: 16 },
          3:  { cellWidth: 16 },
          4:  { cellWidth: 18 },
          5:  { cellWidth: 12 },
          6:  { cellWidth: 18 },
          7:  { cellWidth: 12 },
          8:  { cellWidth: 12 },
          9:  { cellWidth: 38 },
          10: { cellWidth: 55 },
          11: { cellWidth: 38 },
        },
      });

      // ── Footer ──
      const pages = doc.internal.getNumberOfPages();
      for (let p = 1; p <= pages; p++) {
        doc.setPage(p);
        doc.setFontSize(7);
        doc.setTextColor(120, 120, 120);
        doc.text('South East Central Railway — Raipur Division | RRB ALP Handling Report', margin, doc.internal.pageSize.getHeight() - 5);
        doc.text(`Page ${p} of ${pages}`, pageW - margin, doc.internal.pageSize.getHeight() - 5, { align: 'right' });
      }

      const trainee = (td.traineeName || 'report').replace(/\s+/g, '_').toLowerCase();
      doc.save(`ALP_Handling_Report_${trainee}_${new Date().toISOString().slice(0,10)}.pdf`);
      showToast('✅ PDF generated and downloaded!', 'success');
    } catch (err) {
      console.error(err);
      showToast('❌ PDF generation failed. Check console.', 'error');
    } finally {
      btn.disabled = false;
      btn.querySelector('.nl').textContent = 'PDF';
    }
  }

  addRow();
</script>

  This single project now handles THREE things:
    • doGet  ?action=getTrainees  → trainee dropdown for this form
    • doGet  ?action=getData      → dashboard read endpoint
    • doPost                      → form submission (append row)

  On any doPost error, a row is also appended to an "ErrorLog"
  tab in the submission sheet, so failures are visible even
  though the form's fetch uses mode:'no-cors' and can't read
  the real response.

var SUBMIT_SHEET_ID  = '1itfeMUmvvrIKt5F6lSsTsIi6os42DeO7Plnligiqfg4'; // Submission sheet
var TRAINEE_SHEET_ID = '1Yn450uce02hgfbXJmRzd9aBY6bBEgaginXOctu--izg'; // Trainee master sheet
var DATA_SHEET_ID    = '1itfeMUmvvrIKt5F6lSsTsIi6os42DeO7Plnligiqfg4'; // Dashboard read source

function doGet(e) {
  var action = e && e.parameter && e.parameter.action;
  if (action === 'getTrainees') return getTrainees();
  if (action === 'getData')     return getSheetDataAsJSON(e);
  return ContentService
    .createTextOutput(JSON.stringify({status:'ok'}))
    .setMimeType(ContentService.MimeType.JSON);
}

function getSheetDataAsJSON(e) {
  try {
    var ss = SpreadsheetApp.openById(DATA_SHEET_ID);
    var sheetName = (e.parameter.sheet || ss.getSheets()[0].getName());
    var sheet = ss.getSheetByName(sheetName);
    if (!sheet) throw new Error('Sheet "' + sheetName + '" not found');
    var rows = sheet.getDataRange().getDisplayValues();
    return ContentService
      .createTextOutput(JSON.stringify({ success: true, rows: rows }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService
      .createTextOutput(JSON.stringify({ success: false, error: err.message }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function getTrainees() {
  try {
    var ss    = SpreadsheetApp.openById(TRAINEE_SHEET_ID);
    var sheet = ss.getSheets()[0];
    var data  = sheet.getDataRange().getValues();
    var headers = data[0].map(function(h){ return String(h).trim().toUpperCase(); });

    var nameIdx  = headers.findIndex(function(h){ return h.includes('NAME'); });
    var desigIdx = headers.findIndex(function(h){ return h.includes('DESIG'); });
    var hqIdx    = headers.findIndex(function(h){ return h === 'HQ' || h.includes('H.Q') || h.includes('HEAD'); });
    var hrmsIdx  = headers.findIndex(function(h){ return h.includes('HRMS'); });

    var trainees = [];
    for (var i = 1; i < data.length; i++) {
      var row  = data[i];
      var name = nameIdx >= 0 ? String(row[nameIdx] || '').trim() : '';
      if (!name) continue;
      trainees.push({
        name:        name,
        designation: desigIdx >= 0 ? String(row[desigIdx] || '').trim() : '',
        hq:          hqIdx    >= 0 ? String(row[hqIdx]    || '').trim() : '',
        hrms:        hrmsIdx  >= 0 ? String(row[hrmsIdx]  || '').trim() : ''
      });
    }

    return ContentService
      .createTextOutput(JSON.stringify({status:'success', trainees: trainees}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService
      .createTextOutput(JSON.stringify({status:'error', message: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var data    = JSON.parse(e.postData.contents);
    var ss      = SpreadsheetApp.openById(SUBMIT_SHEET_ID);
    var sheet   = ss.getSheets()[0];
    var header  = data.header;
    var entries = data.entries;

    entries.forEach(function(entry) {
      sheet.appendRow([
        header.timestamp,
        header.traineeName,
        header.designation,
        header.hq,
        header.hrms,
        header.nominatedcli,
        entry.entryNo,
        entry.date,
        entry.trainNo,
        entry.locoNo,
        entry.fromStation,
        entry.depTime,
        entry.toStation,
        entry.arrTime,
        entry.footplateKm,
        entry.lpAlpName,
        entry.itemsDiscussed,
        entry.ccSmName
      ]);
    });

    return ContentService
      .createTextOutput(JSON.stringify({status:'success'}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    try {
      var logSs = SpreadsheetApp.openById(SUBMIT_SHEET_ID);
      var errSheet = logSs.getSheetByName('ErrorLog') || logSs.insertSheet('ErrorLog');
      errSheet.appendRow([
        new Date(),
        err.toString(),
        e && e.postData ? e.postData.contents : '(no postData received)'
      ]);
    } catch (logErr) { /* ignore logging failure */ }

    return ContentService
      .createTextOutput(JSON.stringify({status:'error', message: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}
